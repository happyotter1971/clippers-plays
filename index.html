:root { color-scheme: light; --ink: #1f1f1f; --blue: #1f4fbf; --red: #d6262b;
  --marker: "Permanent Marker", "Marker Felt", "Comic Sans MS", cursive; --text: "Atkinson Hyperlegible", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; color: var(--ink); }
body { font: 17px/1.45 var(--text); -webkit-text-size-adjust: 100%; }
.hidden { display: none !important; }
.page { max-width: 400px; margin: 0 auto; padding: 24px 20px 40px; }
.board { display: block; width: 100%; max-width: 280px; margin: 0 auto 4px; }
h1 { margin: 0; text-align: center; font: 44px/1.05 var(--marker); color: var(--blue); }
.tag { margin: 4px 0 22px; text-align: center; font: 19px/1.2 var(--marker); color: var(--red); }
label.field { display: block; font-weight: 700; margin-bottom: 6px; }
.pw { display: flex; gap: 6px; }
.pw input { flex: 1; min-width: 0; min-height: 48px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 6px; font: 18px var(--text); }
.pw input:focus, button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.pw button { min-height: 48px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; font: 700 15px var(--text); color: var(--ink); }
.remember { display: flex; align-items: center; gap: 10px; min-height: 44px; margin: 10px 0 14px; }
.remember input { width: 22px; height: 22px; accent-color: var(--blue); }
.go { width: 100%; min-height: 52px; border: 0; border-radius: 6px; background: var(--ink); color: #fff; font: 22px/1 var(--marker); }
.error { margin: 12px 0 0; padding-left: 12px; border-left: 4px solid var(--red); color: var(--red); font-weight: 700; }
.help { margin: 18px 0 0; text-align: center; font-size: 15px; color: #5c5c5c; }
.loading { padding-top: 30vh; text-align: center; font: 24px var(--marker); color: var(--blue); }
</style>
